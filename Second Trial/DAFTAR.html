<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar AksiKita</title>

<style>
/* ===================== RESET ===================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    background: #e8f3ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* ===================== CONTAINER ===================== */
.container {
    width: 100%;
    height: 100vh;
    background: white;
    display: flex;
    border-radius: 8px;
    overflow: hidden;
}

/* ===================== LEFT SIDE ===================== */
.left {
    width: 45%;
    background: #1e3d8f;
    color: white;
    padding: 80px 50px;
    border-radius: 0 150px 150px 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
}

.left h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

.left p {
    font-size: 16px;
    opacity: 0.9;
    margin-bottom: 40px;
}


.btn-login {
            width: 160px;
            padding: 12px;
            font-size: 16px;
            background: transparent;
            border: 2px solid white;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .btn-login:hover {
            background: white;
            color: #244a9a;
        }

.logo {
    width: 170px;
    display: block;
    margin: -90px auto 50px;
}

/* ===================== RIGHT SIDE ===================== */
.right {
    width: 55%;
    padding: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* === Form === */
.form-daftar {
    width: 100%;
}

.input {
    width: 100%;
    padding: 15px;
    background: #e0e0e0;
    border: none;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 15px;
}

/* ===================== PASSWORD SHOW/HIDE (NO JS) ===================== */
.password-field {
    position: relative;
    width: 100%;
}

#showPw {
    display: none; /* Checkbox disembunyikan */
}

/* Jika checkbox dicentang → password menjadi terlihat */
#showPw:checked ~ .password {
    -webkit-text-security: none !important;
    text-security: none !important;
}

.password {
    -webkit-text-security: disc;
    text-security: disc;
}

.eye-icon {
    position: absolute;
    right: 15px;
    top: 13px;
    cursor: pointer;
    font-size: 18px;
    user-select: none;
}

/* ===================== BUTTON ===================== */
.btn-daftar {
    width: 100%;
    background: #1e3d8f;
    color: white;
    padding: 15px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    border: 2px solid #244a9a;
    text-transform: uppercase;
    transition: 0.3s;
}

.btn-daftar:hover {
    background: white;
    color: #244a9a;
}

/* ===================== SEPARATOR ===================== */
.separator-box {
    display: flex;
    align-items: center;
    margin: 25px 0;
}

.line {
    height: 1px;
    flex: 1;
    background: #777;
}

.atau {
    margin: 0 15px;
    color: #555;
    font-size: 14px;
}

/* ===================== SOCIAL ICONS ===================== */
.socials {
    display: flex;
    justify-content: center;
    gap: 25px;
}

.social-icon {
    width: 32px;
    height: 32px;
    cursor: pointer;
}

/* ===================== RESPONSIVE ===================== */
@media (max-width: 900px) {
    .container {
        flex-direction: column;
        height: auto;
    }
    .left, .right {
        width: 100%;
        border-radius: 0;
    }
}
</style>

</head>
<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <img src="ASSETS/LOGO.png" class="logo">
        <h1>Halo, sobat AksiKita</h1>
        <p>Daftarkan akun anda untuk mengakses fitur yang lebih menarik</p>

        <a href="MASUK.html">
            <button class="btn-login">MASUK</button>
        </a>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <!--
            TANPA JAVASCRIPT:
            - Validasi Gmail pakai pattern HTML5
            - Redirect pakai action=""
            - Eye password pakai checkbox hack
        -->
        <form class="form-daftar" action="MASUK.html" method="get">

            <input type="text" class="input" placeholder="Masukkan nama" required>

            <input type="email" 
                   class="input"
                   placeholder="Masukkan email"
                   pattern=".*@gmail\.com"
                   required>

            <input type="text" class="input" placeholder="Masukkan alamat" required>

            <div class="password-field">
                <input type="checkbox" id="showPw">
                <input type="password" class="input password" placeholder="Buat kata sandi" required>

            </div>

            <button type="submit" class="btn-daftar">DAFTAR</button>

            <div class="separator-box">
                <div class="line"></div>
                <span class="atau">Atau Lanjutkan dengan</span>
                <div class="line"></div>
            </div>

            <div class="socials">
                <img src="ASSETS/google.jpeg" class="social-icon">
                <img src="ASSETS/facebook.jpeg" class="social-icon">
                <img src="ASSETS/twitter.jpeg" class="social-icon">
                <img src="ASSETS/apple.jpeg" class="social-icon">
            </div>

        </form>

    </div>

</div>

</body>
</html>
