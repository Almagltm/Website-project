<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login AksiKita</title>

    <style>
        /* Reset dan styling dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #e8f3ff;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container besar seluruh halaman */
        .container {
            width: 100%;
            height: 100vh;
            background: white;
            border-radius: 15px;
            display: flex;
            overflow: hidden; /* Biar radius tidak bocor */
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        /* BAGIAN KIRI */
        .left {
            width: 55%;
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0 150px 150px 0; /* Melengkung kanan */
        }

        .login-box {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Input umum */
        .input {
            width: 100%;
            padding: 15px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px;
            font-size: 15px;
        }

        /* Bungkus password & ikon show/hide */
        .pw-wrap {
            position: relative;
            width: 100%;
        }

        /* Ikon 👁 untuk show password */
        .show-pw {
            position: absolute;
            right: 15px;
            top: 13px;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }

        /* 
            FITUR SHOW/HIDE PASSWORD TANPA JAVASCRIPT 
            Menggunakan "checkbox hack"
        */

        /* Checkbox disembunyikan */
        #showCheckbox {
            display: none;
        }

        /* Jika checkbox aktif → password tampil */
        #showCheckbox:checked ~ .password {
            -webkit-text-security: none !important;
            text-security: none !important;
        }

        /* Input password default berbentuk bullet (disc) */
        .password {
            -webkit-text-security: disc;
            text-security: disc;
        }

        .forgot {
            text-align: right;
            font-size: 14px;
        }

        /* Tombol login */
        .btn-login {
            width: 100%;
            background: #1e3d8f;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid #244a9a;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(30, 61, 143, 0.2);
            transition: 0.3s ease;
        }

        .btn-login:hover {
            background: white;
            color: #244a9a;
        }

        /* Garis pemisah "atau lanjutkan dengan" */
        .separator-box {
            display: flex;
            align-items: center;
            margin: 25px 0 20px;
            gap: 10px;
        }

        .line {
            flex: 1;
            height: 1px;
            background: #777;
        }

        .atau {
            margin: 0 15px;
            color: #555;
            font-size: 14px;
        }

        /* Ikon sosial */
        .socials {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            cursor: pointer;
        }

        /* BAGIAN KANAN */
        .right {
            width: 45%;
            background: #1e3d8f;
            color: white;
            text-align: center;
            padding: 80px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 150px 0 0 150px;
        }

        .right h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .right p {
            margin: 0 auto 40px;
            font-size: 16px;
            opacity: 0.9;
        }

        .logo {
            width: 180px;
            display: block;
            margin: -90px auto 50px;
        }

        .btn-daftar {
            width: 160px;
            padding: 12px;
            font-size: 16px;
            background: transparent;
            border: 2px solid white;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .btn-daftar:hover {
            background: white;
            color: #244a9a;
        }

        /* Mode responsif */
        @media (max-width: 900px) {
            .container { flex-direction: column; height: auto; }
            .left, .right { width: 100%; border-radius: 0; }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- BAGIAN KIRI (FORM LOGIN) -->
    <div class="left">

        <!--
            ACTION = "BERANDA2.html"
            → Setelah login, halaman langsung pindah ke BERANDA2.html

            PATTERN = @gmail.com
            → Validasi email wajib pakai @gmail.com tanpa JavaScript
        -->
        <form action="BERANDA2.html" method="get" class="login-box">

            <!-- INPUT EMAIL -->
            <input type="email" 
                   placeholder="Masukkan email"
                   class="input"

                   Validasi agar hanya menerima email @gmail.com
                   pattern=".*@gmail\.com"
                   required>

            <!-- INPUT PASSWORD + SHOW/HIDE -->
            <div class="pw-wrap">

                <!-- Checkbox hack untuk show/hide password -->
                <input id="showCheckbox" type="checkbox">

                <!-- Input password -->
                <input type="password" 
                       class="input password" 
                       placeholder="Masukkan kata sandi" 
                       required>

                <!-- Ikon show/hide password -->
                <!-- NOTE: jika ingin aktif, buka komentar -->
                <!-- <label class="show-pw" for="showCheckbox">👁</label> -->
            </div>

            <a href="#" class="forgot">Lupa kata sandi?</a>

            <!-- Tombol login -->
            <button type="submit" class="btn-login">MASUK</button>

            <!-- Pemisah -->
            <div class="separator-box">
                <div class="line"></div>
                <span class="atau">Atau Lanjutkan dengan</span>
                <div class="line"></div>
            </div>

            <!-- Ikon login sosial -->
            <div class="socials">
                <img src="ASSETS/google.jpeg" class="social-icon">
                <img src="ASSETS/facebook.jpeg" class="social-icon">
                <img src="ASSETS/twitter.jpeg" class="social-icon">
                <img src="ASSETS/apple.jpeg" class="social-icon">
            </div>

        </form>
    </div>

    <!-- BAGIAN KANAN -->
    <div class="right">
        <img src="ASSETS/LOGO.png" class="logo">
        <h1>Halo, sobat AksiKita</h1>
        <p>Daftarkan akun anda untuk mengakses fitur yang lebih menarik</p>

        <a href="DAFTAR.html">
            <button class="btn-daftar">DAFTAR</button>
        </a>
    </div>

</div>

</body>
</html>
